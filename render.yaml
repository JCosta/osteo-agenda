# Render Blueprint: web service + PostgreSQL, ambos em Frankfurt.
services:
  - type: web
    name: osteo-agenda
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osteo-agenda-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Admin__Email
        sync: false
      - key: Admin__PasswordHash
        sync: false
      - key: GoogleCalendar__ServiceAccountJson
        sync: false
      - key: Clinic__Locations__0__Name
        value: Braga
      - key: Clinic__Locations__0__GoogleCalendarId
        sync: false

databases:
  - name: osteo-agenda-db
    region: frankfurt
    plan: basic-256mb
    databaseName: osteo_agenda
    postgresMajorVersion: "16"
    ipAllowList: []
