name: ci
on:
  push:
    branches-ignore: [ci-results]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OSTEO_TEST_DB: Host=localhost;Username=postgres;Password=postgres
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Osteo.Agenda.slnx -c Release --logger "console;verbosity=normal" 2>&1 | tee test.log

      - name: Docker build
        id: docker
        if: steps.test.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          docker build -t osteo-agenda . 2>&1 | tail -n 60 | tee docker.log

      - name: Smoke test (app + login + pages)
        id: smoke
        if: steps.test.outcome == 'success'
        shell: bash
        run: |
          dotnet publish src/Osteo.Agenda.Web/Osteo.Agenda.Web.csproj -c Release -o publish-out
          ci/smoke.sh

      # Publishes the logs to the ci-results branch so they can be read without Actions access.
      - name: Publish results
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/results
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "test: ${{ steps.test.outcome }}"
            echo "docker: ${{ steps.docker.outcome }}"
            echo "smoke: ${{ steps.smoke.outcome }}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/results/summary.txt
          [ -f test.log ] && grep -E "error|warn|Failed|Passed|Total tests|failed|passed|Error Message|Assert|at Osteo" test.log | grep -v "^\s*$" | head -n 400 > /tmp/results/test-highlights.log || true
          [ -f test.log ] && tail -n 300 test.log > /tmp/results/test-tail.log || true
          [ -f docker.log ] && cp docker.log /tmp/results/docker.log || true
          [ -d smoke ] && cp -r smoke /tmp/results/smoke || true
          cd /tmp/results
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-results
          git add .
          git commit -qm "CI results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
